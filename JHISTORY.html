<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記述式クイズ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(120deg, #f0f4f8 0%, #e9f0ff 100%);
        }
        .quiz-container {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.10);
            padding: 32px 28px 28px 28px;
            margin-top: 32px;
        }
        .question {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        .question-image {
            max-width: 100%;
            max-height: 200px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .answer-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .answer-input {
            flex: 1;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
        }
        .submit-answer {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-answer:hover {
            background-color: #0056b3;
        }
        .score {
            font-size: 18px;
            margin-top: 20px;
            text-align: right;
        }
        .file-input {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .file-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .file-selector label {
            margin-right: 5px;
        }
        .question-count {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .question-count input {
            width: 60px;
            padding: 5px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .password-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .password-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .password-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            font-size: 16px;
        }
        .password-button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .password-button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            margin-top: 10px;
            display: none;
        }
        .quiz-content {
            display: none;
        }
        .chart-container {
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
        }
        .next-button {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #f7faff;
            border: 2px solid #e3eafc;
            color: #007bff;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            width: 100%;
            text-align: center;
            transition: background 0.2s, border 0.2s;
        }
        .next-button:hover {
            background: #e3eafc;
            border-color: #007bff;
        }
        .next-button:disabled {
            background-color: #6c757d;
            border-color: #6c757d;
            cursor: not-allowed;
        }
        .progress-container {
            width: 100%;
            background-color: #f0f0f0;
            border-radius: 5px;
            margin: 20px 0;
        }
        .progress-bar {
            width: 0%;
            height: 22px;
            background: linear-gradient(90deg, #4CAF50 60%, #8BC34A 100%);
            border-radius: 5px;
            transition: width 0.3s ease;
            text-align: center;
            color: white;
            line-height: 20px;
            font-size: 14px;
            box-shadow: 0 1px 6px rgba(76,175,80,0.10);
        }
        .answer-feedback {
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: center;
        }
        .option {
            border-radius: 12px;
            font-size: 18px;
            padding: 18px;
            background: #f7faff;
            border: 2px solid #e3eafc;
            transition: background 0.2s, border 0.2s;
        }
        .option.selected {
            background: linear-gradient(90deg, #007bff 60%, #0056b3 100%);
            border-color: #0056b3;
            color: #fff;
        }
        .option:hover {
            background: #e3eafc;
        }
        #timer {
            position: absolute;
            top: 18px;
            left: 32px;
            font-size: 22px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #007bff 60%, #00c6ff 100%);
            padding: 7px 22px;
            border-radius: 30px;
            box-shadow: 0 2px 12px rgba(0,123,255,0.15);
            letter-spacing: 2px;
            display: none;
            z-index: 1000;
            border: none;
            transition: background 0.3s, color 0.3s;
        }

    </style>
</head>
<body>
    <div id="passwordScreen" class="password-container">
        <div class="password-box">
            <h1>パスワードを入力</h1>
            <input type="password" id="passwordInput" class="password-input" placeholder="パスワードを入力">
            <button onclick="checkPassword()" class="password-button">ログイン</button>
            <div id="errorMessage" class="error-message">パスワードが間違っています</div>
        </div>
    </div>

    <div id="quizScreen" class="quiz-content">
        <div class="quiz-container">
            <h1>記述式クイズ</h1>
            <div class="main-menu">
                <button onclick="openSettings()" class="submit-answer">設定</button>
                <button onclick="startDefaultQuiz()" class="submit-answer">クイズを開始</button>
            </div>
            <div id="settingsFrame" class="settings-frame" style="display: none;">
                <iframe src="settings.html?subject=history" width="100%" height="400" frameborder="0"></iframe>
            </div>
            <div id="loading" class="loading">読み込み中...</div>
            <div id="question" class="question"></div>
            <div id="timer" style="position: absolute; top: 10px; left: 20px; font-size: 20px; font-weight: bold; display: none; z-index: 1000;">00:00</div>
            <div class="progress-container" style="display: none;">
                <div id="progressBar" class="progress-bar">0%</div>
            </div>
            <div id="answerInputContainer" class="answer-input-container" style="display:none;">
                <input type="text" id="answerInput" class="answer-input" placeholder="ここに解答を入力">
                <button id="submitAnswer" class="submit-answer">送信</button>
            </div>
            <div id="answerFeedback" class="answer-feedback"></div>
            <button id="nextButton" class="next-button" onclick="nextQuestion()">次へ</button>
            <div id="chartContainer" class="chart-container"></div>
        </div>
    </div>

    <script>

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    
        let questions = [];
        let currentQuestion = 0;
        let score = 0;
        let selectedQuestions = [];
        let isDebugMode = false;
        let showAnswer = true;
    
        let questionCount = 5;
        const minQuestionCount = 1;
        let maxQuestionCount = 0; // 動的に設定するため初期値を0に
    
        let userAnswers = [];
    
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current);
            return result;
        }
    
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    
        let timerInterval = null;
        let elapsedSeconds = 0;
        function startTimer() {
            elapsedSeconds = 0;
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('timer').style.display = 'block';
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const min = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const sec = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${min}:${sec}`;
            }, 1000);
        }
        function stopTimer() {
            document.getElementById('timer').style.display = 'none';
            if (timerInterval) clearInterval(timerInterval);
        }
    
        

        function displayQuestion() {
            document.getElementById('answerFeedback').innerText = '';
            document.getElementById('answerInputContainer').style.display = 'flex';
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').disabled = false;
            document.getElementById('submitAnswer').disabled = false;
            document.getElementById('nextButton').style.display = 'none';

            if (currentQuestion >= selectedQuestions.length) {
                stopTimer();
                document.getElementById('question').innerText = 'クイズ終了！';
                document.getElementById('question').style.textAlign = 'center';
                document.getElementById('answerInputContainer').style.display = 'none';
                document.getElementById('nextButton').style.display = 'none';
                updateProgressBar(100);
                // 正解数をカウント
                let correctCount = 0;
                selectedQuestions.forEach((q, i) => {
                    if (userAnswers[i] !== undefined && userAnswers[i] === q.answer) correctCount++;
                });
                // 正解数表示を追加
                const scoreDisplay = document.createElement('div');
                scoreDisplay.style.fontSize = '24px';
                scoreDisplay.style.marginTop = '20px';
                scoreDisplay.style.textAlign = 'center';
                scoreDisplay.innerHTML = `正解数: ${correctCount} / ${selectedQuestions.length} 問`;
                document.getElementById('question').appendChild(scoreDisplay);
                // 入力答えと正解の一覧を表示
                const resultTable = document.createElement('table');
                resultTable.style.width = '100%';
                resultTable.style.marginTop = '20px';
                resultTable.style.borderCollapse = 'collapse';
                resultTable.innerHTML = `
                    <tr>
                        <th style="border-bottom:1px solid #ccc; padding:8px;">No.</th>
                        <th style="border-bottom:1px solid #ccc; padding:8px;">問題</th>
                        <th style="border-bottom:1px solid #ccc; padding:8px;">あなたの答え</th>
                        <th style="border-bottom:1px solid #ccc; padding:8px;">正解</th>
                    </tr>
                `;
                selectedQuestions.forEach((q, i) => {
                    const userAns = userAnswers[i] !== undefined ? userAnswers[i] : '';
                    const correctAns = q.answer !== undefined ? q.answer : '';
                    // 差分をハイライト
                    const diffed = diffStrings(userAns, correctAns);
                    const userDiff = diffed.user;
                    const correctDiff = diffed.correct;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="padding:8px; border-bottom:1px solid #eee;">${q.number}</td>
                        <td style="padding:8px; border-bottom:1px solid #eee;">${q.question}</td>
                        <td style="padding:8px; border-bottom:1px solid #eee;">${userDiff}</td>
                        <td style="padding:8px; border-bottom:1px solid #eee;">${correctDiff}</td>
                    `;
                    resultTable.appendChild(tr);
                });
                document.getElementById('question').appendChild(resultTable);
                return;
            }
            document.querySelector('.progress-container').style.display = 'block';
            const questionData = selectedQuestions[currentQuestion];
            const questionContainer = document.getElementById('question');
            const formattedQuestion = questionData.question.replace(/\\n/g, '<br>');
            questionContainer.innerHTML = `問題 ${currentQuestion + 1}: ${formattedQuestion}`;
            if (isDebugMode && showAnswer) {
                const correctAnswerDiv = document.createElement('div');
                correctAnswerDiv.style.color = '#28a745';
                correctAnswerDiv.style.marginBottom = '10px';
                correctAnswerDiv.style.fontWeight = 'bold';
                correctAnswerDiv.innerHTML = `正解: ${questionData.answer}`;
                questionContainer.appendChild(correctAnswerDiv);
            }
            if (questionData.image) {
                const img = document.createElement('img');
                img.src = questionData.image;
                img.className = 'question-image';
                img.alt = '問題画像';
                questionContainer.appendChild(img);
            }
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answerInput');
            const userAnswer = answerInput.value.trim();
            userAnswers[currentQuestion] = userAnswer;
            answerInput.disabled = true;
            document.getElementById('submitAnswer').disabled = true;
            // 送信後すぐ次の問題へ
            setTimeout(() => {
                nextQuestion();
            }, 300); // 0.3秒だけ待ってから遷移（誤送信防止のため、不要なら0でOK）
        }

        document.getElementById('submitAnswer').addEventListener('click', checkAnswer);
        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.getElementById('submitAnswer').disabled) {
                checkAnswer();
            }
        });

        function updateProgressBar(progress) {
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${progress}%`;
            progressBar.textContent = `${progress}%`;
        }

        function nextQuestion() {
            currentQuestion++;
            const progress = Math.round((currentQuestion / selectedQuestions.length) * 100);
            updateProgressBar(progress);
            displayQuestion();
        }



        // 差分をハイライトする関数（簡易版: 文字単位で異なる部分を赤色で表示）
        function diffStrings(user, correct) {
            if (user === correct) {
                return { user: user, correct: correct };
            }
            let minLen = Math.min(user.length, correct.length);
            let firstDiff = minLen;
            for (let i = 0; i < minLen; i++) {
                if (user[i] !== correct[i]) {
                    firstDiff = i;
                    break;
                }
            }
            // 末尾の一致部分も除外
            let userEnd = user.length, correctEnd = correct.length;
            while (userEnd > firstDiff && correctEnd > firstDiff && user[userEnd-1] === correct[correctEnd-1]) {
                userEnd--;
                correctEnd--;
            }
            return {
                user: user.slice(0, firstDiff) + '<span style="background:#ffd6d6;">' + user.slice(firstDiff, userEnd) + '</span>' + user.slice(userEnd),
                correct: correct.slice(0, firstDiff) + '<span style="background:#d6ffd6;">' + correct.slice(firstDiff, correctEnd) + '</span>' + correct.slice(correctEnd)
            };
        }

        function enterFullScreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function startQuizWithFullScreen() {
            enterFullScreen();
            startDefaultQuiz();
        }

        // リトライボタン機能を追加
        function showRetryButton() {
            const retryButton = document.createElement('button');
            retryButton.textContent = 'リトライ';
            retryButton.style.cssText = `
                display: block;
                margin: 20px auto;
                padding: 15px 30px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 18px;
                cursor: pointer;
                width: 200px;
            `;
            retryButton.onmouseover = function() {
                this.style.backgroundColor = '#0056b3';
            };
            retryButton.onmouseout = function() {
                this.style.backgroundColor = '#007bff';
            };
            retryButton.onclick = function() {
                // リトライボタンを削除
                this.remove();
                // メインメニューを再表示
                document.querySelector('.main-menu').style.display = 'block';
                document.getElementById('settingsFrame').style.display = 'none';
                // 問題とオプションをクリア
                document.getElementById('question').innerHTML = '';
                document.getElementById('answerInputContainer').style.display = 'none';
                document.getElementById('nextButton').style.display = 'none';
                // プログレスバーをリセット
                updateProgressBar(0);
                // タイマーを必ず非表示にする
                document.getElementById('timer').style.display = 'none';
                stopTimer(); // タイマーを停止
            };
            document.getElementById('question').appendChild(retryButton);
            document.querySelector('.progress-container').style.display = 'none'; // リトライボタンを表示したらプログレスバーを非表示に
            stopTimer(); // リトライボタンを表示したらタイマーを停止
        }

        // ページ離脱時の警告
        window.addEventListener('beforeunload', function(e) {
            // クイズが進行中の場合は警告を表示
            if (document.getElementById('quizScreen').style.display === 'block' && 
                document.getElementById('answerInputContainer').style.display === 'flex') {
                e.preventDefault();
                e.returnValue = 'ページを離れると進行中のクイズは保存されません。';
                return e.returnValue;
            }
        });

        // パスワード認証
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const correctPassword = 'admin'; // パスワード設定
            if (password === correctPassword) {
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('quizScreen').style.display = 'block';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        // iframeからのメッセージを受信
        window.addEventListener('message', function(event) {
            if (event.data.type === 'START_QUIZ') {
                loadQuestionsWithSettings(event.data.settings);
            } else if (event.data.type === 'GO_BACK') {
                // 設定画面から戻る
                document.querySelector('.main-menu').style.display = 'block';
                document.getElementById('settingsFrame').style.display = 'none';
            }
        });

        function openSettings() {
            document.querySelector('.main-menu').style.display = 'none';
            document.getElementById('settingsFrame').style.display = 'block';
        }

        function startDefaultQuiz() {
            // localStorageから設定を取得
            let settings = {
                selectedFile: 'CSV/JHI.csv',
                questionCount: 5,
                isDebugMode: false,
                showAnswer: true,
                debugModeType: 'single',
                specificQuestion: '',
                questionRangeStart: '',
                questionRangeEnd: ''
            };
            const saved = localStorage.getItem('historyQuizSettings');
            if (saved) {
                Object.assign(settings, JSON.parse(saved));
            }
            loadQuestionsWithSettings(settings);
        }

        function loadQuestionsWithSettings(settings) {
            const selectedFiles = settings.selectedFiles || [settings.selectedFile]; // 複数ファイル対応
            questionCount = settings.questionCount;
            isDebugMode = settings.isDebugMode;
            showAnswer = settings.showAnswer;
            
            const startIndex = 2;
            const chartContainer = document.getElementById('chartContainer');
            chartContainer.innerHTML = '';

            document.getElementById('loading').style.display = 'block';
            startTimer();

            // 複数ファイルを順次読み込み
            loadMultipleFiles(selectedFiles, startIndex);
        }

        // 複数ファイルを読み込む関数
        function loadMultipleFiles(files, startIndex) {
            let allQuestions = [];
            let filesProcessed = 0;
            
            files.forEach((file, index) => {
                fetch(file)
                    .then(response => response.text())
                    .then(csv => {
                        const lines = csv.split('\n').map(line => line.trim()).filter(line => line);
                        const actualEndIndex = lines.length - 1;
                        
                        // 指定した範囲内の問題のみを抽出
                        for (let i = startIndex; i <= actualEndIndex; i++) {
                            const data = parseCSVLine(lines[i]);
                            if (data.length < 5 || isNaN(parseInt(data[0]))) continue;
                            const choices = data.slice(2, 6)
                                .filter(choice => choice)
                                .map(choice => {
                                    choice = choice.trim();
                                    if (choice.startsWith('"') && choice.endsWith('"')) {
                                        choice = choice.slice(1, -1);
                                    }
                                    if (choice.startsWith("'")) {
                                        choice = choice.slice(1);
                                    }
                                    return choice;
                                });
                            if (choices.length === 0) continue;
                            allQuestions.push({
                                number: parseInt(data[0]),
                                question: data[1],
                                answer: choices[0],
                                image: data[6] || null,
                                sourceFile: file
                            });
                        }
                        
                        filesProcessed++;
                        
                        // すべてのファイルが処理されたら次の処理を実行
                        if (filesProcessed === files.length) {
                            processAllQuestions(allQuestions);
                        }
                    })
                    .catch(error => {
                        console.error(`ファイル ${file} の読み込みエラー:`, error);
                        filesProcessed++;
                        
                        // エラーがあっても他のファイルの処理を続行
                        if (filesProcessed === files.length) {
                            processAllQuestions(allQuestions);
                        }
                    });
            });
        }

        // すべての問題を処理する関数
        function processAllQuestions(allQuestions) {
            questions = [];

            // questions配列を問題番号でソート
            allQuestions.sort((a, b) => a.number - b.number);
            
            // 重複する問題番号を処理（後から読み込まれたファイルを優先）
            const uniqueQuestions = [];
            const seenNumbers = new Set();
            
            for (let i = allQuestions.length - 1; i >= 0; i--) {
                const question = allQuestions[i];
                if (!seenNumbers.has(question.number)) {
                    uniqueQuestions.unshift(question);
                    seenNumbers.add(question.number);
                }
            }
            
            questions = uniqueQuestions;
            maxQuestionCount = questions.length;
            
            if (questionCount > maxQuestionCount) {
                questionCount = maxQuestionCount;
            }
            if (maxQuestionCount === 0) {
                alert('問題データが正しくありません。または指定された範囲に問題がありません。');
                document.getElementById('loading').style.display = 'none';
                return;
            }
            if (isDebugMode && currentSettings.debugModeType === 'single') {
                const specificNumber = parseInt(currentSettings.specificQuestion);
                if (isNaN(specificNumber) || specificNumber < minQuestionCount || specificNumber > maxQuestionCount) {
                    alert(`有効な問題番号を入力してください (${minQuestionCount}～${maxQuestionCount})`);
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                const found = questions.find(q => q.number === specificNumber);
                if (found) {
                    selectedQuestions = [found];
                } else {
                    alert(`指定した問題番号(${specificNumber})が見つかりません。`);
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                currentQuestion = 0;
                score = 0;
                userAnswers = [];
                displayQuestion();
            } else if (isDebugMode && currentSettings.debugModeType === 'range') {
                const rangeStart = parseInt(currentSettings.questionRangeStart);
                const rangeEnd = parseInt(currentSettings.questionRangeEnd);
                if (isNaN(rangeStart) || isNaN(rangeEnd) || rangeStart < minQuestionCount || rangeEnd > maxQuestionCount || rangeEnd < rangeStart) {
                    alert(`有効な問題番号の範囲を入力してください (${minQuestionCount}～${maxQuestionCount})`);
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                selectedQuestions = questions.filter(q => {
                    const qNum = parseInt(q.number);
                    return qNum >= rangeStart && qNum <= rangeEnd;
                });
                if (selectedQuestions.length === 0) {
                    alert('指定された範囲に問題が見つかりません。');
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                currentQuestion = 0;
                score = 0;
                userAnswers = [];
                displayQuestion();
            } else {
                if (questionCount === 0) {
                    alert('選択したファイルに有効な問題が見つかりませんでした。');
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                shuffleArray(questions);
                selectedQuestions = questions.slice(0, questionCount);
                currentQuestion = 0;
                score = 0;
                userAnswers = [];
                displayQuestion();
            }
            document.getElementById('loading').style.display = 'none';
        }

    </script>
</body>
